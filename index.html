<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PathfinderBio Academy (LMS demo)</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--muted:#667085;--line:#e4e7ec;--brand:#3b5bdb;--brand-soft:#e7ecff;
--ok:#12805c;--ok-soft:#dcf5ea;--warn:#b54708;--warn-soft:#fef0c7;--bad:#b42318;--bad-soft:#fee4e2;--font:"Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#1d2440;color:#fff}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#5c7cfa,#22b8cf);flex:none}
header b{font-size:16px;font-weight:600}
.demo{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15);color:#d0d5dd}
header .sp{flex:1}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:#d0d5dd}
.av{width:28px;height:28px;border-radius:50%;background:#7048e8;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600}
nav{display:flex;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--brand)}
main{padding:16px 20px 24px;max-width:1200px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.k .l{font-size:12px;color:var(--muted)}.k .v{font-size:24px;font-weight:700;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px}
.focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ph .n{font-size:17px;font-weight:700}.ph .m{color:var(--muted);font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}.c-b{background:var(--brand-soft);color:var(--brand)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.co{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.co .cv{height:6px}
.co .ci{padding:10px 12px}
.co b{display:block;font-size:13.5px;margin-bottom:6px}
.bar{height:6px;background:#eef0f4;border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand)}
.sm{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #f0f2f5;white-space:nowrap}
tr.cur td{background:#f4f6ff}
tr[data-mrn]{cursor:pointer}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <span class="logo" aria-hidden="true"></span>
  <b>PathfinderBio Academy</b><span class="demo">LMS demo, e.g. LearnWorlds via SSO</span>
  <span class="sp"></span>
  <span class="user"><span class="av">AW</span>Dr. Alan Whitfield</span>
</header>
<nav>
  <button data-tab="patients" class="on">My patients</button>
  <button data-tab="training">My training</button>
</nav>
<main id="main"></main>
<script>
(function(){
var COURSES=["Welcome to your program","Preparing for treatment","Living with your care plan","Medication safety"];
var COLORS=["#3b5bdb","#0ca678","#7048e8","#f08c00"];
var STAGES=["Referral","Education","Readiness","Consultation","Physician Review","Approval","Onboarding","Follow-up"];
var P=[["Emily Carter","PFB-10234",4,"Dr. Alan Whitfield"],["Marcus Lee","PFB-10241",2,"Dr. Maya Chen"],
["Sofia Ramirez","PFB-10255",1,"Dr. Maya Chen"],["James O'Neil","PFB-10262",5,"Dr. Alan Whitfield"],
["Priya Nair","PFB-10270",3,"Dr. Samuel Ortiz"],["Daniel Kim","PFB-10288",6,"Dr. Samuel Ortiz"],
["Olivia Brooks","PFB-10293",0,"Dr. Maya Chen"],["Robert Hughes","PFB-10301",7,"Dr. Alan Whitfield"]];
function prog(s){return [100,Math.min(100,s*30),Math.min(100,Math.max(0,(s-2)*25)),0];}
function quiz(s,i){var p=prog(s)[i];return p===100?(78+((s*7+i*5)%20)):(p>0?null:null);}
function lastSeen(s){return ["5 days ago","Yesterday","Today","2 days ago","Today","Yesterday","3 days ago","Today"][s];}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var q=new URLSearchParams(location.search);var mrn=(q.get("mrn")||"").trim();var tab=q.get("tab")||"patients";
function ready(s){var p=prog(s);return p[0]===100&&p[1]===100;}
function patients(){
  var mine=P.filter(function(p){return p[3]==="Dr. Alan Whitfield"||p[1]===mrn;});
  var all=P.length,done=0,att=0;P.forEach(function(p){var pr=prog(p[2]);done+=pr.filter(function(x){return x===100;}).length;if(pr[1]>0&&pr[1]<100)att++;});
  var h='<div class="kpis">'+
   k("Patients enrolled",all)+k("Modules completed",done)+k("Ready for physician review",P.filter(function(p){return ready(p[2])&&p[2]<=4;}).length)+k("Need attention",att)+'</div>';
  var focus=P.filter(function(p){return p[1]===mrn;})[0];
  if(focus){h+=patientCard(focus,true);}
  h+='<div class="card"><h2>All patients</h2><table><thead><tr><th>Patient</th><th>MRN</th><th>Journey stage</th><th>Overall progress</th><th>Last activity</th><th>Status</th></tr></thead><tbody>';
  P.forEach(function(p){var pr=prog(p[2]);var avg=Math.round((pr[0]+pr[1]+pr[2]+pr[3])/4);
   var st=ready(p[2])?'<span class="chip c-ok">Ready</span>':(pr[1]>0?'<span class="chip c-warn">In progress</span>':'<span class="chip c-b">Started</span>');
   h+='<tr data-mrn="'+p[1]+'" class="'+(p[1]===mrn?'cur':'')+'"><td><b>'+esc(p[0])+'</b></td><td>'+p[1]+'</td><td>'+STAGES[p[2]]+'</td><td style="min-width:160px"><div class="bar"><i style="width:'+avg+'%"></i></div><span class="sm">'+avg+'%</span></td><td>'+lastSeen(p[2])+'</td><td>'+st+'</td></tr>';});
  h+='</tbody></table><div class="note">Synthetic demo data. Progress is synced to Creatio (Course progress) through the LMS API.</div></div>';
  return h;
}
function patientCard(p,isFocus){
  var pr=prog(p[2]);
  var h='<div class="card'+(isFocus?' focus':'')+'"><div class="ph"><span class="n">'+esc(p[0])+'</span><span class="m">'+p[1]+' &middot; '+STAGES[p[2]]+' &middot; '+esc(p[3])+'</span>'+
   (ready(p[2])?'<span class="chip c-ok">Education complete - ready for review</span>':'<span class="chip c-warn">Education in progress</span>')+'</div><div class="courses">';
  COURSES.forEach(function(c,i){var v=pr[i];var qz=quiz(p[2],i);
   h+='<div class="co"><div class="cv" style="background:'+COLORS[i]+'"></div><div class="ci"><b>'+c+'</b><div class="bar"><i style="width:'+v+'%"></i></div>'+
   '<span class="sm">'+(v===100?'Completed':v?v+'% complete':'Not started')+(qz?' &middot; Quiz '+qz+'%':'')+'</span></div></div>';});
  return h+'</div></div>';
}
function training(){
  var T=[["Program clinical protocol v3","Required",100,2],["Patient eligibility criteria","Required",100,1],
         ["Informed consent and HIPAA basics","Required",60,1],["Managing side effect reports","Recommended",0,2]];
  var cme=T.reduce(function(a,t){return a+(t[2]===100?t[3]:0);},0);
  var h='<div class="kpis">'+k("Courses assigned",T.length)+k("Completed",T.filter(function(t){return t[2]===100;}).length)+k("CME credits earned",cme)+k("Certification","Valid to 2027")+'</div>';
  h+='<div class="card"><h2>My training</h2><table><thead><tr><th>Course</th><th>Type</th><th>Progress</th><th>CME</th><th>Status</th></tr></thead><tbody>';
  T.forEach(function(t){h+='<tr><td><b>'+t[0]+'</b></td><td>'+t[1]+'</td><td style="min-width:160px"><div class="bar"><i style="width:'+t[2]+'%"></i></div><span class="sm">'+t[2]+'%</span></td><td>'+t[3]+'</td><td>'+
   (t[2]===100?'<span class="chip c-ok">Completed</span>':t[2]?'<span class="chip c-warn">In progress</span>':'<span class="chip c-b">Not started</span>')+'</td></tr>';});
  return h+'</tbody></table></div>';
}
function k(l,v){return '<div class="k"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function render(){
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-tab")===tab);});
  document.getElementById("main").innerHTML=tab==="training"?training():patients();
  document.querySelectorAll("tr[data-mrn]").forEach(function(r){r.onclick=function(){mrn=r.getAttribute("data-mrn");render();window.scrollTo(0,0);};});
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){tab=b.getAttribute("data-tab");render();};});
render();
})();
</script>
</body>
</html>
